[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-bruno"
version = "0.1.1"
description = "MCP server for running and inspecting Bruno API collections"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["bruno", "mcp", "model-context-protocol", "api-testing"]
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.0.0",
  "tomli>=2.0 ; python_full_version < '3.11'",
]

[project.scripts]
bruno-mcp = "bruno_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
python_classes = ["Test*", "*Tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = [
  # The MCP tools intentionally spawn the bru CLI; subprocess usage is the point of this server.
  "S603",
  "S404",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S108"]
"scripts/**" = ["S101", "S607"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
