# Bruno MCP configuration
# Place this file as bruno-mcp.toml in the working directory, or globally at
# ~/.config/bruno-mcp/config.toml. Environment variables always override these values.

[workspace]
# Bruno roots: directories that contain `collections/` and/or `environments/`.
# When at least one root exists on disk, collection paths outside every root are
# rejected (see [security]). Keep this list accurate.
roots = [
  "/home/user/project/bruno"
]

[bruno]
# Pinned Bruno CLI version. Used when auto-installing and to warn when the
# installed `bru` binary has a different major version.
# Env override: BRUNO_MCP_BRU_VERSION
cli_version = "4.2.0"

# When false (default), a missing `bru` binary is a hard error instead of a
# silent global npm install. Enable only if you accept runtime installs.
# Env override: BRUNO_MCP_AUTO_INSTALL_BRU=1
auto_install = false

[limits]
# Kill a bru run after this many seconds. Env: BRUNO_MCP_RUN_TIMEOUT
run_timeout_seconds = 300
# Cap captured bru stdout/stderr (bytes). Env: BRUNO_MCP_MAX_OUTPUT_BYTES
max_output_bytes = 8388608
# Maximum concurrent bru executions. Env: BRUNO_MCP_MAX_CONCURRENT_RUNS
max_concurrent_runs = 2

[artifacts]
# Where raw run reports are stored (written with owner-only 0600 permissions).
# Defaults to <cwd>/build/artifacts. Env: BRUNO_MCP_ARTIFACTS_DIR
# dir = "/var/lib/bruno-mcp/artifacts"
# Delete artifacts older than this many hours (0 disables). Env: BRUNO_MCP_ARTIFACT_TTL_HOURS
ttl_hours = 24
# Keep at most this many artifact files (0 disables). Env: BRUNO_MCP_ARTIFACT_MAX_FILES
max_files = 50

[security]
# Reject collection paths outside [workspace] roots (applies when at least one
# configured root exists on disk). Env: BRUNO_MCP_ENFORCE_ROOT_CONFINEMENT=0
enforce_root_confinement = true

[auth]
inherited_variables = [
  "BRUNO_AUTH_TOKEN",
  "BRUNO_API_KEY"
]

# Map secure MCP input names to the variable names used inside Bruno collections.
# For example, if requests use {{bearerToken}}, the value entered as BRUNO_AUTH_TOKEN
# will be injected as bearerToken.
[auth.variable_aliases]
BRUNO_AUTH_TOKEN = ["BRUNO_AUTH_TOKEN", "bearerToken", "BEARER_TOKEN", "AUTH_TOKEN", "TOKEN", "accessToken", "access_token"]
BRUNO_API_KEY = ["BRUNO_API_KEY", "apiKey", "API_KEY", "xApiKey", "x-api-key"]

[defaults]
environment = "dev"
